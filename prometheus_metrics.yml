# 📊 ENTERPRISE SRE PERFORMANCE PLATFORM SPECIFICATION
global:
  scrape_interval: 5s # High-velocity metric polling interval for clinical data arrays
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'clinical-streaming-nodes'
    metrics_path: '/api/v1/metrics'
    static_configs:
      - targets: ['localhost:8000', 'enterprise_clinical_cluster_node_1:8000']
        labels:
          deployment_tier: 'Principal-Architect-V'
          component_source: 'STREAMING_CORE'

# AUTOMATED CLUSTER HEALTH ALERTS
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - 'alertmanager:9093'